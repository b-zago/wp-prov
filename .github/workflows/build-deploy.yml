name: Build and Deploy

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          tags: wp-prov:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test server responds 200 on /
        run: |
          # Run in dev mode so the startup hook doesn't try to reach a cluster.
          docker run -d --name app -p 8000:8000 -e WP_PROV_DEV=1 wp-prov:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ -o /dev/null; then
              echo "OK"
              docker rm -f app
              exit 0
            fi
            sleep 1
          done
          echo "Server test failed"
          docker logs app
          docker rm -f app
          exit 1

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/b-zago/wp-prov/dashboard:latest
            ghcr.io/b-zago/wp-prov/dashboard:${{ steps.sha.outputs.sha }}
          cache-from: type=gha

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k3s-cluster repo
        uses: actions/checkout@v6
        with:
          repository: b-zago/k3s-cluster
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update image tag
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            VALUES_FILE="cluster/workloads/wp-prov/values-prod.yml"
          else
            VALUES_FILE="cluster/workloads/wp-prov/values-stage.yml"
          fi
          sed -i "s|server: ghcr.io/b-zago/wp-prov/dashboard:.*|server: ghcr.io/b-zago/wp-prov/dashboard:${{ needs.build.outputs.sha }}|" $VALUES_FILE
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add $VALUES_FILE
          git commit -m "${{ github.ref_name }}: update wp-prov server to ${{ needs.build.outputs.sha }}"
          git push
