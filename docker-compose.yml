services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
      - "4321:4321"
    volumes:
      - .:/usr/src/app
      - frontend_node_modules:/usr/src/app/frontend/node_modules
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - MAX_WORDPRESS_INSTANCES=5
      # Use an in-memory fake store (no k8s/ArgoCD needed) for local dev.
      # Set WP_PROV_DEV=0 to hit a real cluster instead.
      - WP_PROV_DEV=1

volumes:
  frontend_node_modules:
